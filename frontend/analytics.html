<!DOCTYPE html>
<html>
<head>
<title>Analytics</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>📊 Analytics</h1>

<div class="card">
    <h2 id="total"></h2>
    <h2 id="open"></h2>
    <h2 id="closed"></h2>
</div>

<script>
fetch("http://localhost:5000/admin-all")
.then(res => res.json())
.then(data => {

    let total = data.length;
    let open = data.filter(c => c.status === "Open").length;
    let closed = data.filter(c => c.status === "Closed").length;

    document.getElementById("total").innerText = "Total: " + total;
    document.getElementById("open").innerText = "Open: " + open;
    document.getElementById("closed").innerText = "Closed: " + closed;
});
</script>

</body>
</html>
