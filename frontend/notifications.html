<!DOCTYPE html>
<html>
<head>
<title>Notifications</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🔔 Notifications</h1>

<div id="notify"></div>

<script>
fetch("http://localhost:5000/admin-all")
.then(res => res.json())
.then(data => {

    let html = "";

    data.forEach(c => {
        if (c.status === "Closed") {
            html += `<div class="card">✅ ${c.title} is Closed</div>`;
        } else {
            html += `<div class="card">⚠️ ${c.title} still Open</div>`;
        }
    });

    document.getElementById("notify").innerHTML = html;
});
</script>

</body>
</html>
